<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Simulação segura do LÚMINUS, assistente residencial em construção por Valdir Moura.">
<title>LÚMINUS | Simulação segura</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--aura:rgba(100,200,255,.3);--glow:rgba(180,220,255,.8);--rune:rgba(180,220,255,.42);--text:rgba(220,238,255,.86);--glass:rgba(20,30,50,.42);--glass-border:rgba(100,200,255,.22)}
*{box-sizing:border-box}body{margin:0;width:100vw;min-height:100vh;background:radial-gradient(circle at bottom,#0b1021 0%,#000 100%);overflow-x:hidden;font-family:Rajdhani,sans-serif;color:#fff;user-select:none}.back{position:fixed;left:18px;bottom:18px;z-index:50;color:#00f3ff;text-decoration:none;border:1px solid var(--glass-border);background:rgba(5,10,24,.62);border-radius:999px;padding:10px 14px;font-weight:700;letter-spacing:1px}.title-bg{position:fixed;top:10%;width:100%;text-align:center;font-size:clamp(22px,7vw,48px);letter-spacing:14px;color:var(--text);text-transform:uppercase;opacity:.24;font-weight:700;text-shadow:0 0 20px rgba(0,243,255,.2)}
.top-bar{position:fixed;top:20px;left:20px;right:20px;display:flex;justify-content:space-between;z-index:15;pointer-events:none}.brand-container{display:flex;align-items:center;gap:10px}.brand{font-size:14px;letter-spacing:2px;color:var(--rune);font-weight:700}.led{width:8px;height:8px;background:#00f3ff;border-radius:50%;box-shadow:0 0 10px #00f3ff}.weather{display:flex;align-items:center;gap:8px;color:rgba(200,220,255,.9);margin-top:8px}.weather .material-symbols-outlined{color:#00f3ff;text-shadow:0 0 10px rgba(0,243,255,.4)}.clock{text-align:right}.time{font-size:42px;font-weight:700;text-shadow:0 0 10px rgba(0,243,255,.5);line-height:1}.date{font-size:14px;letter-spacing:2px;color:var(--rune);text-transform:uppercase;margin-top:5px}
.core-container{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:130px 18px 170px}.core-wrapper{position:relative;width:270px;height:270px;filter:drop-shadow(0 0 28px rgba(0,243,255,.28));cursor:pointer}.halo{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(120,230,255,.18);animation:spin 18s linear infinite}.halo:after{content:'';position:absolute;inset:28px;border-radius:50%;border:1px dashed rgba(180,220,255,.22);animation:spin 14s linear reverse infinite}.face{position:absolute;top:50%;left:50%;width:190px;height:140px;transform:translate(-50%,-50%);border-radius:58px;background:linear-gradient(145deg,rgba(5,24,70,.96),rgba(0,180,255,.30));border:1px solid rgba(120,230,255,.38);box-shadow:inset 0 0 24px rgba(0,243,255,.22),0 0 34px rgba(0,243,255,.32)}.eye{position:absolute;top:43px;width:34px;height:43px;border-radius:999px;background:#eaffff;box-shadow:0 0 14px #00f3ff,0 0 26px rgba(0,243,255,.65)}.eye.left{left:48px}.eye.right{right:48px}.mouth{position:absolute;left:50%;bottom:28px;width:48px;height:20px;transform:translateX(-50%);border-bottom:4px solid #eaffff;border-radius:0 0 30px 30px;filter:drop-shadow(0 0 8px rgba(0,243,255,.9))}.face:before,.face:after{content:'';position:absolute;top:52px;width:26px;height:48px;border-radius:999px;background:linear-gradient(180deg,#675cff,#00f3ff);opacity:.9;box-shadow:0 0 16px rgba(0,243,255,.45)}.face:before{left:-21px}.face:after{right:-21px}.speaking .eye{height:20px;top:34px;animation:eyeTalk .45s ease-in-out infinite alternate}.speaking .mouth{width:34px;height:30px;bottom:24px;border:3px solid #eaffff;border-top:0;animation:mouthTalk .28s ease-in-out infinite alternate}@keyframes spin{to{transform:rotate(360deg)}}@keyframes eyeTalk{from{opacity:.65;transform:scaleY(.72)}to{opacity:1;transform:scaleY(1.08)}}@keyframes mouthTalk{from{height:12px;width:30px;opacity:.75}to{height:34px;width:42px;opacity:1}}
.conversation{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);width:min(88vw,660px);z-index:16;text-align:center}.state{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:rgba(180,220,255,.72);text-shadow:0 0 12px rgba(0,243,255,.25);margin-bottom:8px}.bubble{padding:14px 18px;border-radius:18px;border:1px solid rgba(120,230,255,.18);background:rgba(5,10,24,.58);backdrop-filter:blur(10px);box-shadow:0 0 24px rgba(0,0,0,.28),inset 0 0 22px rgba(0,243,255,.055);text-align:left}.line{display:flex;gap:10px;align-items:baseline;font-size:15px}.label{min-width:82px;color:rgba(180,220,255,.55);letter-spacing:1.5px;text-transform:uppercase;font-size:11px}.txt{color:rgba(235,248,255,.92)}
.panel{position:fixed;inset:0;background:rgba(0,0,0,.86);backdrop-filter:blur(8px);display:none;z-index:30;align-items:center;justify-content:center;padding:24px}.panel.active{display:flex}.panel-box{width:min(92vw,520px)}.panel-title{font-size:24px;letter-spacing:5px;text-align:center;margin-bottom:24px;border-bottom:1px solid var(--rune);padding-bottom:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.glass-btn{background:var(--glass);border:1px solid var(--glass-border);border-radius:15px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgba(255,255,255,.75);cursor:pointer;transition:.2s}.glass-btn .material-symbols-outlined{font-size:36px;margin-bottom:10px}.glass-btn.on{border-color:#00f3ff;background:rgba(0,243,255,.15);box-shadow:0 0 25px rgba(0,243,255,.15)}.glass-btn.on .material-symbols-outlined{color:#00f3ff;text-shadow:0 0 15px #00f3ff}.close{margin:24px auto 0;display:block;width:max-content;padding:10px 28px;border-radius:999px;border:1px solid rgba(255,100,100,.3);color:rgba(255,120,120,.9);cursor:pointer}.actions{position:fixed;top:50%;right:22px;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:18}.action{border:1px solid var(--glass-border);background:rgba(5,10,24,.72);color:#eafcff;border-radius:999px;padding:11px 14px;font-family:inherit;font-weight:700;letter-spacing:1px;cursor:pointer}.action:hover{border-color:#00f3ff}.safe{position:fixed;left:20px;top:104px;color:rgba(180,220,255,.55);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;z-index:15}@media(max-width:760px){.title-bg{display:none}.time{font-size:30px}.core-wrapper{width:230px;height:230px}.actions{position:static;transform:none;flex-direction:row;flex-wrap:wrap;justify-content:center;margin-top:-145px;padding-bottom:160px}.grid{grid-template-columns:1fr}.conversation{bottom:72px}.back{bottom:12px}.safe{display:none}}
</style>
</head>
<body>
<a class="back" href="./teste-site-vendavel.html">← Voltar</a>
<div class="title-bg">SYSTEM ONLINE</div>
<div class="top-bar"><div><div class="brand-container"><div class="brand">AGRESTE TECH</div><div class="led"></div></div><div class="weather"><span class="material-symbols-outlined">cloud</span><span>DEMO • 28°</span></div></div><div class="clock"><div class="time" id="time">--:--</div><div class="date" id="date">SIMULAÇÃO</div></div></div>
<div class="safe">Modo vitrine: sem acesso à automação real</div>
<div class="core-container"><div class="core-wrapper" id="core" onclick="openPanel()"><div class="halo"></div><div class="face"><span class="eye left"></span><span class="eye right"></span><span class="mouth"></span></div></div></div>
<div class="actions"><button class="action" onclick="intro()">Ouvir explicação</button><button class="action" onclick="scene()">Simular cena</button><button class="action" onclick="openPanel()">Painel demo</button></div>
<div class="conversation"><div class="state" id="state">EM ESPERA</div><div class="bubble"><div class="line"><span class="label">LÚMINUS</span><span class="txt" id="speech">Lúminus online. Toque em “Ouvir explicação”.</span></div></div></div>
<div class="panel" id="panel"><div class="panel-box"><div class="panel-title">CONTROLE DEMO</div><div class="grid"><div class="glass-btn" onclick="toggle(this,'Luz da sala')"><span class="material-symbols-outlined">lightbulb</span><span>Luz da sala</span></div><div class="glass-btn" onclick="toggle(this,'Ventilador')"><span class="material-symbols-outlined">mode_fan</span><span>Ventilador</span></div><div class="glass-btn" onclick="toggle(this,'Modo cinema')"><span class="material-symbols-outlined">theaters</span><span>Cinema</span></div><div class="glass-btn" onclick="toggle(this,'Sensor de presença')"><span class="material-symbols-outlined">sensors</span><span>Sensor</span></div></div><div class="close" onclick="closePanel()">VOLTAR AO NÚCLEO</div></div></div>
<script>
const core=document.getElementById('core'), speech=document.getElementById('speech'), state=document.getElementById('state'), panel=document.getElementById('panel');
function tick(){const n=new Date;time.textContent=n.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});date.textContent=n.toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'}).toUpperCase()}setInterval(tick,1000);tick();
function bestVoice(){const vs=speechSynthesis.getVoices();return vs.filter(v=>(v.lang||'').toLowerCase().startsWith('pt')).sort((a,b)=>score(b)-score(a))[0]||null}function score(v){const n=(v.name||'').toLowerCase();let s=0;if((v.lang||'').toLowerCase().includes('pt-br'))s+=20;if(n.includes('google'))s+=8;if(/antonio|daniel|ricardo|felipe|brasil|brazil/.test(n))s+=10;if(/maria|female|feminina|luciana/.test(n))s-=8;return s}if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=bestVoice;
function say(display,spoken){speech.textContent=display;state.textContent='FALANDO';core.classList.add('speaking');if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spoken||display.replace(/L[úu]minus/gi,'Luminus').replace(/LÚMINUS/g,'Luminus'));u.lang='pt-BR';const v=bestVoice();if(v)u.voice=v;u.rate=.90;u.pitch=.98;u.onend=()=>{core.classList.remove('speaking');state.textContent='EM ESPERA'};speechSynthesis.speak(u)}else setTimeout(()=>{core.classList.remove('speaking');state.textContent='EM ESPERA'},2500)}
function intro(){say('Eu sou uma simulação do LÚMINUS, assistente residencial em construção para controlar automações, luzes, sensores e cenas com Home Assistant. Esta vitrine não acessa a automação real.', 'Eu sou uma simulação do Luminus, assistente residencial em construção para controlar automações, luzes, sensores e cenas com Home Assistant. Esta vitrine não acessa a automação real.')}function scene(){document.querySelectorAll('.glass-btn').forEach((b,i)=>{if(i<3)b.classList.add('on')});say('Cena demo ativada: luz, ventilador e modo cinema ligados. Na versão real, comandos assim poderão controlar dispositivos integrados ao Home Assistant.', 'Cena demo ativada: luz, ventilador e modo cinema ligados. Na versão real, comandos assim poderão controlar dispositivos integrados ao Home Assistant.')}function openPanel(){panel.classList.add('active');say('Painel demo aberto. Estes botões são apenas uma simulação segura.', 'Painel demo aberto. Estes botões são apenas uma simulação segura.')}function closePanel(){panel.classList.remove('active')}function toggle(el,name){el.classList.toggle('on');say(name+' '+(el.classList.contains('on')?'ligado':'desligado')+'.', name+' '+(el.classList.contains('on')?'ligado':'desligado')+'.')}
</script>
</body>
</html>
